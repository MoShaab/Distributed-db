
services:
  # Linux Container with FDW support
  postgres_linux:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: university_postgres
    platform: linux/amd64
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    # Remove the command override
    ports:
      - "5432:5432"
    networks:
      - university_net

        # Python Scripts Container
  python_app:
    build:
      context: .
      dockerfile: python.Dockerfile
    container_name: python_app
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - ./scripts:/app/scripts
    networks:
      - university_net
    depends_on:
      - postgres_linux
      - mysql_linux
      - mssql_windows

  


  # Linux Container
  mysql_linux:
    image: mysql:latest
    container_name: university_mysql
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: university_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3308"
    networks:
      - university_net

  # Windows Container
  mssql_windows:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: university_mssql
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - mssql_data:/var/opt/mssql
      - ./mssql/init:/docker-entrypoint-initdb.d
    ports:
      - "1433:1433"
    networks:
      - university_net
  


volumes:
  postgres_data:
  mysql_data:
  mssql_data:

networks:
  university_net:
    driver: bridge